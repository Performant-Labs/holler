[package]
name = "holler-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Holler protocol v2: JSON-RPC 2.0 envelope codec, method catalog, error table, name/id newtypes, the A2A object model, and the Noise XK handshake core (no I/O deps)"

[lib]
name = "holler_proto"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# base64: A2A encodes `raw` (file) parts as base64 strings on the wire; this
# crate encodes/decodes them (the old in-house 80-line base64 is gone, #146).
base64 = { workspace = true }
# ulid: correlation ids are minted as real ULIDs (ADR 0004) — #146 replaced
# the "carry an opaque string" claim with the crate that mints them.
ulid = { workspace = true }
# time: RFC3339 emission timestamps for the debug-logging banner/events
# (story #144) — the one non-OS, non-network addition to the "no I/O" crate.
time = { workspace = true }
# snow: the Noise_XK_25519_ChaChaPoly_BLAKE2s handshake core (issue #338) —
# pure computation, no I/O, so it fits this crate's charter the same way
# `time` does. See the root Cargo.toml's own comment for the feature choice.
snow = { workspace = true }
# hex: `noise::HandshakeXk`'s public API is hex strings (the wire-facing
# form every other module in this crate and its consumers already use for
# keys/ids), never raw `snow` types (issue #338). `sas::derive_sas` follows
# the same convention (issue #339): its input is the hex handshake hash
# `noise::HandshakeXk::handshake_hash_hex` already returns.
hex = { workspace = true }
# sha2 + hkdf: `sas::derive_sas` (issue #339) derives the pairing SAS via
# HKDF-SHA256 under a versioned label. See the root Cargo.toml's own comment
# for why this is a second, distinct consumer of sha2 (holler-hub's token
# store uses HMAC, not HKDF, for an unrelated purpose).
sha2 = { workspace = true }
hkdf = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
# x25519-dalek: `noise`'s own tests derive a keypair's public half the same
# way `holler_hub::identity`/`holler_body::x25519_identity` do, to pin the
# interop this issue's design depends on (issue #338). Test-only — no
# production code in this crate performs a Diffie-Hellman itself; `snow`
# does that internally.
x25519-dalek = { workspace = true }

# Workspace lints (issue #149): inherit [workspace.lints] from the root
# Cargo.toml — deny dead_code, clippy unwrap/expect/panic/unreachable, and the
# complexity gates (thresholds in clippy.toml).
[lints]
workspace = true
