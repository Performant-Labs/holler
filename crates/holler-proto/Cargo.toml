[package]
name = "holler-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Holler protocol v2: JSON-RPC 2.0 envelope codec, method catalog, error table, name/id newtypes, and the A2A object model (no I/O deps)"

[lib]
name = "holler_proto"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# RFC3339 microsecond emission timestamps for the debug-logging banner/events
# (story #144). `time` is already a workspace dependency (used by holler-cli);
# this is the one non-OS, non-network addition to the "no I/O" crate.
time = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
