[package]
name = "holler-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Holler protocol v2: JSON-RPC 2.0 envelope codec, method catalog, error table, name/id newtypes, and the A2A object model (no I/O deps)"

[lib]
name = "holler_proto"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# base64: A2A encodes `raw` (file) parts as base64 strings on the wire; this
# crate encodes/decodes them (the old in-house 80-line base64 is gone, #146).
base64 = { workspace = true }
# ulid: correlation ids are minted as real ULIDs (ADR 0004) — #146 replaced
# the "carry an opaque string" claim with the crate that mints them.
ulid = { workspace = true }
# time: RFC3339 emission timestamps for the debug-logging banner/events
# (story #144) — the one non-OS, non-network addition to the "no I/O" crate.
time = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }

# Workspace lints (issue #149): inherit [workspace.lints] from the root
# Cargo.toml — deny dead_code, clippy unwrap/expect/panic/unreachable, and the
# complexity gates (thresholds in clippy.toml).
[lints]
workspace = true
