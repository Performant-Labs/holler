[package]
name = "holler-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The hub role of the holler binary (empty in the workspace skeleton)"

[lib]
name = "holler_hub"
path = "src/lib.rs"

# Declare only what is consumed (issue #155 §7 — `cargo machete` fails CI
# otherwise). The crate is still the skeleton's empty lib; the hub stories add
# their dependencies (from the root [workspace.dependencies]) as they use them.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
hostname = { workspace = true }
fs4 = { workspace = true }
httparse = { workspace = true }
http = { workspace = true }
holler-proto = { path = "../holler-proto" }
# Story #163: the token store. fs4 is the whole-file advisory lock around every
# load-modify-save; getrandom mints secrets/credentials/ids/pepper; hmac + sha2
# store secrets at rest as HMAC-SHA-256(pepper, secret); hex encodes ids/digests.
hmac = { workspace = true }
sha2 = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
# subtle: constant-time HMAC comparison (a timing side-channel on secret
# comparison is a fail-closed defect — #163).
subtle = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
libc = { workspace = true }

# Workspace lints (issue #149): inherit [workspace.lints] from the root
# Cargo.toml — deny dead_code, clippy unwrap/expect/panic/unreachable, and the
# complexity gates (thresholds in clippy.toml).
[lints]
workspace = true
