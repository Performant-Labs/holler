[package]
name = "holler-body"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The body role of the holler binary (empty in the workspace skeleton)"

[lib]
name = "holler_body"
path = "src/lib.rs"

# Declare only what is consumed (issue #155 §7 — `cargo machete` fails CI
# otherwise). Story #176 (`body join` / `body detach` / `body status`) adds the
# first real dependencies: the one-shot join needs the WebSocket client
# transport and the wire envelope/types; `status` / the on-disk identity need
# serde(+json) to read and write `body/credential.json`; `tokio` drives the
# client's event loop; and the system roots make `wss://` fail closed on a bad
# certificate (ADR 0002) — all pinned in the root [workspace.dependencies].
[dependencies]
holler-proto = { path = "../holler-proto" }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The `wss://` connect is TLS: rustls 0.23 needs a process-global crypto
# provider installed before use (the binary installs the `ring` provider in
# `main`). The body only needs to *query* whether a provider is installed so a
# `wss` join can fail closed (a clear exit-1 reason) when none is — hence
# `rustls` itself is a holler-body dependency, not just a transitive one
# (story #176).
rustls = { workspace = true }
# the advisory `body/run.lock` instance lock (issue #182), the same flock
# pattern the hub's `serve.lock` uses (the `sync` feature is set once at the
# workspace level).
fs4 = { workspace = true }
# the reconnect backoff's jitter (issue #182): a 64-bit CSPRNG draw, the same
# primitive the hub's token store uses for secrets.
getrandom = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# Workspace lints (issue #149): inherit [workspace.lints] from the root
# Cargo.toml — deny dead_code, clippy unwrap/expect/panic/unreachable, and the
# complexity gates (thresholds in clippy.toml).
[lints]
workspace = true
