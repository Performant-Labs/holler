[package]
name = "holler-body"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The body role of the holler binary (empty in the workspace skeleton)"

[lib]
name = "holler_body"
path = "src/lib.rs"

# Declare only what is consumed (issue #155 §7 — `cargo machete` fails CI
# otherwise). The crate is still the skeleton's empty lib; the body stories add
# their dependencies (from the root [workspace.dependencies]) as they use them.
[dependencies]

[dev-dependencies]
tempfile = { workspace = true }

# Workspace lints (issue #149): inherit [workspace.lints] from the root
# Cargo.toml — deny dead_code, clippy unwrap/expect/panic/unreachable, and the
# complexity gates (thresholds in clippy.toml).
[lints]
workspace = true
