[package]
name = "holler-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The holler binary — parses the full ADR 0003 CLI surface"
# The stub agent (story #130) lives at tests/stub-acp/main.rs and is a [[bin]],
# not an integration test. Cargo would otherwise auto-detect that file under
# tests/ as a *second* target named `stub-acp` (an integration test), which
# collides with the bin and emits a "present in multiple build targets" warning
# on every build. Disabling auto-detection and declaring the real test targets
# explicitly (below) keeps the bin the sole owner of the name while still
# building/running both integration tests.
autotests = false

[lib]
name = "holler_cli"
path = "src/lib.rs"

[[bin]]
name = "holler"
path = "src/main.rs"

# ACP v2 stub agent (story #130): a fake agent process the test suite spawns
# in place of OpenCode. The spec pins it at tests/stub-acp/main.rs and names
# the bin `stub-acp` so `cargo_bin("stub-acp")` resolves to it (cargo appends
# `.exe` on Windows). (A file under tests/ would otherwise be auto-detected as
# an integration-test target; the explicit [[bin]] pins it as a binary.)
[[bin]]
name = "stub-acp"
path = "tests/stub-acp/main.rs"

# Explicit integration-test targets. With autotests = false (set above, to keep
# the stub-acp dir from spawning a colliding auto-detected target), every real
# test under tests/ must be declared here or it silently stops building.
[[test]]
name = "cli_invocation_test"
path = "tests/cli_invocation_test.rs"

[[test]]
name = "logging_test"
path = "tests/logging_test.rs"

[[test]]
name = "stub_acp_test"
path = "tests/stub_acp_test.rs"

# Selftests for the shared test harness (story #138). Exercises the pieces of
# `tests/support/mod.rs` that are exercisable before the hub/body stories land
# (StateDir drop, wait_for timeout, kill_tree).
[[test]]
name = "support_selftest"
path = "tests/support_selftest.rs"

# CLI-surface fixture and docs doc-test (issue #155 §5/§6). Both read
# tests/fixtures/cli-surface*.txt via the shared tests/fixture/mod.rs.
[[test]]
name = "cli_surface_test"
path = "tests/cli_surface_test.rs"

[[test]]
name = "docs_cli_test"
path = "tests/docs_cli_test.rs"

# `holler hub serve` + `holler hub status` e2e (story #143): the hub's
# WebSocket listener, instance lock, Unix-domain control socket, and status.
[[test]]
name = "hub_serve_test"
path = "tests/hub_serve_test.rs"

# `holler hub token …` e2e (story #163): the CLI's thin layer over the hub's
# token store — each verb's ADR 0003 exit code and its human/`--json` stdout
# shape, driving the real binary against an isolated `HOLLER_STATE_DIR`.
[[test]]
name = "token_cli_test"
path = "tests/token_cli_test.rs"

# `holler body join` / `body detach` / `body status` e2e (story #176): the
# body's identity lifecycle — a join redeems a minted secret over the wire and
# persists the credential, a refused redeem is exit 1, a plaintext non-loopback
# `ws://` is a fail-closed exit 3, detach forgets the identity, and status
# reports this process's own join state.
[[test]]
name = "body_join_test"
path = "tests/body_join_test.rs"

# `holler body run` e2e (issue #182): the connection loop — authenticate,
# hello, presence heartbeat, liveness/reconnect, detach, and the hub-side
# `hub token ping` companion — driving both real binaries against an isolated
# `HOLLER_STATE_DIR` and a real loopback hub.
[[test]]
name = "body_run_test"
path = "tests/body_run_test.rs"

# Explicit pin (story #129): the test-of-tests canary is named here so a later
# move of the file under a subdirectory cannot silently un-discover it from the
# CI canary step.
[[test]]
name = "wire_selftest"
path = "tests/wire_selftest.rs"

# ACP v2 spawn driver (issue #188): drives the real `holler_body::acp_driver`
# against the real `stub-acp` process. Lives here (not `holler-body/tests/`)
# because `CARGO_BIN_EXE_stub-acp` only resolves in this package's own test
# targets — see the file's own doc comment for the full reasoning.
[[test]]
name = "acp_driver_test"
path = "tests/acp_driver_test.rs"

# `crash_mid_turn_is_error_not_hang` split into its own process (own
# `[[test]]` target) — its crash-detection signal is sensitive to
# process-wide reactor/thread-pool contention from the *other* 18
# `acp_driver_test` tests spawning/tearing down their own children in the
# same binary; giving it a fresh process removes that contention entirely.
# See the file's own module doc for the measured evidence.
[[test]]
name = "acp_driver_crash_test"
path = "tests/acp_driver_crash_test.rs"

# Session manager (issue #189): per-session tasks, the busy-turn queue,
# isolated cancel, and post-cancel freshness. Lives here (not
# `holler-body/tests/`) for the same `CARGO_BIN_EXE_stub-acp` reason as
# `acp_driver_test.rs` above — see this file's own module doc.
[[test]]
name = "session_manager_test"
path = "tests/session_manager_test.rs"

# `status`/`caps`/`support`/`protocol` — local and remote, both peers (issue
# #185): the hub's live-registry-backed counts and confirmation pass, the
# body's local probes (no run required), and `hub query TARGET …`'s
# resolve-and-forward path — driving both real binaries against a real
# loopback hub, the same discipline as `body_run_test.rs` (#182).
[[test]]
name = "query_test"
path = "tests/query_test.rs"

# Talk (issue #190): `say` → `session/prompt`, coalesced `session/update`,
# the final result, and the TalkLog. Lives here for the same
# `CARGO_BIN_EXE_stub-acp` reason as `session_manager_test` above.
[[test]]
name = "talk_test"
path = "tests/talk_test.rs"

# Roster (issue #186): the live roster read over the control socket, shown as
# a table (or `--json`) against a real hub + body. Lives here for the same
# `CARGO_BIN_EXE_stub-acp` reason as `session_manager_test` / `talk_test` above.
[[test]]
name = "roster_cli_test"
path = "tests/roster_cli_test.rs"

# Issue #255: proves `Roster::sweep()` actually runs inside the production
# hub process (a dedicated background task, not just the unit tests'
# injected-clock coverage). Lives here for the same `CARGO_BIN_EXE_stub-acp`
# reason as `roster_cli_test` / `talk_test` above.
[[test]]
name = "roster_sweep_wireup_test"
path = "tests/roster_sweep_wireup_test.rs"

# Interrupt (issue #191): `session/cancel`, the `interrupt SESSION TEXT`
# redirect, the ack-timeout, and the priority path — against a real hub +
# body. Lives here for the same `CARGO_BIN_EXE_stub-acp` reason as
# `talk_test`/`roster_cli_test` above.
[[test]]
name = "interrupt_test"
path = "tests/interrupt_test.rs"

# `answer SESSION CHOICE` (issue #151): resolve a held permission/elicitation
# against a real hub + body + `stub-acp` (`--ask-permission`/
# `--ask-elicitation`). Lives here for the same `CARGO_BIN_EXE_stub-acp`
# reason as `talk_test` / `roster_cli_test` above.
[[test]]
name = "answer_cli_test"
path = "tests/answer_cli_test.rs"

# Declare only what is consumed (issue #155 §7 — `cargo machete` fails CI
# otherwise). A story that starts using a workspace dependency adds it here in
# the same PR; the skeleton's speculative list was removed in #155.
[dependencies]
clap = { workspace = true }
# body_cmd.rs's shared `doc_outcome` (issue #229): generic over any of
# `holler_body::query`'s document types via their derived `Serialize`.
serde = { workspace = true }
# stub-acp bin (serializes its ACP frames) and the body-join e2e test's
# `#[cfg(test)]` unit test (decodes the credential/status documents it inspects).
serde_json = { workspace = true }
holler-proto = { path = "../holler-proto" }
# Story #143: the `hub serve` / `hub status` leaves drive the hub crate (the
# listener + control socket). This is the first story to consume holler-hub
# from the CLI, so per the #155 §7 rule it is declared here.
holler-hub = { path = "../holler-hub" }
# Story #176: the `body join` / `body detach` / `body status` leaves drive the
# body crate (the wire join, the on-disk identity, and the local status doc).
# It is a runtime dependency of the bin (not a dev-dep): `main.rs` calls the
# body helpers on the normal command path.
holler-body = { path = "../holler-body" }
# Story #176: `main` installs the rustls crypto provider that a `wss://`
# (TLS) WebSocket join needs (the `aws-lc-rs` default, matching the
# workspace's tokio-tungstenite TLS features). It is a runtime dep of the bin
# (the bin installs the provider before any connect; the body fails a `wss`
# connect closed if none is installed).
rustls = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
rstest = { workspace = true }
tokio = { workspace = true }        # wire_selftest runtime canary
libc = { workspace = true }         # tests/support kill_tree
tokio-tungstenite = { workspace = true }  # hub_serve_test WS client
futures-util = { workspace = true }  # hub_serve_test Sink/Stream traits

# Workspace lints (issue #149): inherit [workspace.lints] from the root
# Cargo.toml — deny dead_code, clippy unwrap/expect/panic/unreachable, and the
# complexity gates (thresholds in clippy.toml).
[lints]
workspace = true
