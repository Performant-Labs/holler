[package]
name = "holler-adapter-herdr"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Herdr adapter: implements holler_pane::HerdrPort over Herdr's local socket (empty in the workspace skeleton)"

[lib]
name = "holler_adapter_herdr"
path = "src/lib.rs"

# Declare only what is consumed (issue #155 §7 — `cargo machete` fails CI
# otherwise). The crate is an empty skeleton; its owning story adds the
# dependencies it uses.
[dependencies]

# Workspace lints (issue #149).
[lints]
workspace = true
