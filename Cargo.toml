[workspace]
members = ["crates/*"]
resolver = "2"

# ADR 0003: one version for the whole workspace, from 0.1.0. Member crates
# set `version.workspace = true` and inherit this; bumps happen at release
# points only (the Releasing story).
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

# ADR 0003 (CLI + Versioning): the dependency set is pinned exactly to what
# the old repos shipped (holler-server / holler-client) and is known to
# build together on the stable toolchain. `holler-cli` depends on all of
# them so every crate is compiled and checked by CI from the skeleton on.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `preserve_order` backs `serde_json::Map` with `IndexMap` (insertion-ordered)
# instead of the default `HashMap` (hash-seed-dependent iteration order). With
# it, re-serialising a deserialised value emits object keys in a deterministic
# order. The canonical round-trip tests additionally sort keys, so the
# byte-for-byte comparison is order-independent and process-stable. `indexmap`
# is already a serde_json dep, so this adds no new crate.
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "macros", "time", "io-util", "rt", "signal"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = { version = "0.3.34", features = ["sink"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
hostname = "0.4.2"
getrandom = "0.2"
hmac = "0.12"
sha2 = "0.10"
fs4 = { version = "1.1.0", features = ["sync"] }
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
agent-client-protocol = "2.1.0"
ulid = "1"
libc = "0.2"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
rstest = "0.23"
