[workspace]
members = ["crates/*"]
resolver = "2"

# ADR 0003: one version for the whole workspace, from 0.1.0. Member crates
# set `version.workspace = true` and inherit this; bumps happen at release
# points only (the Releasing story).
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

# Workspace lints (issue #149). Every crate opts in with `[lints] workspace =
# true`. The deny set makes the #145–#148 defect classes unmergeable:
# `dead_code` (rustc) forbids a helper landing without a caller; the clippy
# denies forbid the panic/expect/unreachable escape hatches a helper hides
# behind (a helper must return a `Result`, and the caller — only a bin's
# `main` — decides how to surface it). Thresholds live in `clippy.toml`.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
cognitive_complexity = "deny"
too_many_lines = "deny"
struct_excessive_bools = "deny"
large_enum_variant = "warn"

[workspace.lints.rust]
dead_code = "deny"

# ADR 0003 (CLI + Versioning): the dependency set is pinned exactly to what
# the old repos shipped (holler-server / holler-client) and is known to
# build together on the stable toolchain. `holler-cli` depends on all of
# them so every crate is compiled and checked by CI from the skeleton on.
#
# Lint rule #149: every dep with a feature list carries a `# for <consumer>`
# marker on its own line naming who needs each feature — a dep with an
# unexplained feature is an unreviewable one (scripts/lint.sh check 5).
[workspace.dependencies]
# clap derive macros for the CLI tree (Parser/Subcommand/ValueEnum).
clap = { version = "4", features = ["derive"] } # for holler-cli
# serde derive macros for the proto types (holler-proto) and config types (holler-body).
serde = { version = "1", features = ["derive"] } # for holler-proto, holler-body
# serde_json without `preserve_order`: holler-proto's canonical round-trips
# sort keys explicitly (tests/common) and the hub's `--json` status printer is
# hand-built (insertion order), so nothing relies on serde_json::Map's ordering.
serde_json = { version = "1" } # for holler-proto, holler-cli
# A2A encodes `raw` (file) parts as base64 strings; holler-proto encodes/decodes them.
base64 = "0.22"
# rt-multi-thread/signal: the hub & body event loops; net: loopback WebSocket
# listener + control socket; sync: mpsc/oneshot channels; time: timers
# (say --timeout budget, presence TTL); io-util: framed WebSocket I/O; rt: the
# reactor every other feature builds on.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "sync", "macros", "time", "io-util", "rt", "signal"] } # for holler-hub
# rustls-tls-native-roots: the hub/body TLS WebSocket transport over 127.0.0.1
# (ADR 0002).
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] } # for holler-hub, holler-body
# sink: the WebSocket upgrade/futures plumbing.
futures-util = { version = "0.3.34", features = ["sink"] } # for holler-hub, holler-body
# RFC3339 emission timestamps for the debug-logging banner/events (story #144).
time = { version = "0.3", features = ["formatting", "parsing", "macros"] } # for holler-proto
# the `hostname` field of a hello/status document.
hostname = "0.4.2"
# sync: the advisory file lock on the state dir.
fs4 = { version = "1.1.0", features = ["sync"] } # for holler-hub, holler-cli
# The hub performs the WebSocket server handshake by hand (tokio-tungstenite
# only ships a *client* async handshake). `httparse` parses the upgrade GET;
# `http` supplies the `Request`/`Response` types tungstenite's
# `handshake::server::create_response` consumes to compute the
# `Sec-WebSocket-Accept` key.
httparse = "1.10.1"
http = "1.5.0"
# the body config file and the CLI's config reader.
toml = "0.8"
# json/stream: the hub's HTTP/JSON outward face (roster JSON); the body's HTTP
# attach driver (issue #194) also uses `stream` for the OpenCode `/event` SSE
# byte stream and `json` for its request/response bodies.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] } # for holler-cli, holler-body
# the ACP wire types the stub agent and body speak. `unstable_protocol_v2`
# gates the crate's v2 (protocol-v2) typed client surface — the ACP v2 spawn
# driver (issue #188) is the first real consumer; the crate's own v2 examples
# all require this feature, so v2 is a real, load-bearing dependency, not an
# unused "unstable" opt-in.
agent-client-protocol = { version = "2.1.0", features = ["unstable_protocol_v2"] } # for holler-body
# ULID correlation ids and token ids.
ulid = "1"
# hmac + sha2: the hub's token store (story #163) stores secrets at rest as
# HMAC-SHA-256(pepper, secret), never raw. Both consumed by holler-hub.
hmac = "0.12"
sha2 = "0.10"
# getrandom: 256-bit CSPRNG for join secrets, credentials, token ids, client
# ids, and the autogen pepper (story #163). Consumed by holler-hub.
getrandom = "0.3"
# hex: token ids (tok_/cli_ <32hex>) and the at-rest HMAC digests are hex
# (story #163). Consumed by holler-hub.
hex = "0.4"
# subtle: constant-time comparison of HMAC digests in the token store — a
# timing side-channel on secret comparison is a fail-closed defect (story #163).
# Consumed by holler-hub.
subtle = "2"
# rustls: the crypto provider behind `wss://` (TLS) WebSocket. rustls 0.23
# picks its crypto from a process-global that must be installed before the
# first ClientConfig/ServerConfig. The binary installs the `aws-lc-rs`
# default (the same provider the workspace's tokio-tungstenite TLS features
# select) in `main` before any connect (story #176). Consumed by holler-cli
# (links `rustls::crypto::aws_lc_rs::default_provider`) and holler-body
# (queries `rustls::crypto::CryptoProvider::get_default` to fail a `wss`
# connect closed when no provider is installed).
rustls = "0.23"
# x25519-dalek: the hub's long-lived X25519 static identity keypair (issue
# #322) — pinned by `body join` from the join line, the pre-message key for a
# future Noise XK handshake (#321). `static_secrets` is the feature that
# exposes `StaticSecret` (a key used across many connections, not the
# single-use `EphemeralSecret`); keys are built from this crate's own
# `getrandom`-drawn bytes (`StaticSecret::from([u8; 32])`), so the crate's own
# `getrandom`/`reusable_secrets`/rng-object-construction features are not
# needed. Consumed by holler-hub.
x25519-dalek = { version = "3", features = ["static_secrets"] } # for holler-hub
# ed25519-dalek: the body's long-lived Ed25519 signing keypair (issue #323) —
# registered (public half only) at `circuit/join`, used to sign the
# `circuit/authenticate` → `circuit/prove` challenge transcript. Keys are
# built from this crate's own `getrandom`-drawn bytes
# (`SigningKey::from_bytes(&[u8; 32])`), so the crate's own `rand_core`
# feature is not needed. Consumed by holler-body (signs) and holler-hub
# (verifies against the registered public key — `VerifyingKey`/`Signature`
# are always available, `rand_core` gates only key *generation* helpers this
# crate does not use).
ed25519-dalek = { version = "3" } # for holler-body, holler-hub
# POSIX process-group control for the test harness's kill_tree.
libc = "0.2"
# scratch state dirs for the test harness.
tempfile = "3"
# subprocess assertions for the CLI surface tests.
assert_cmd = "2"
# predicates for CLI output assertions.
predicates = "3"
# table-driven cases for the invocation/codec tests.
rstest = "0.23"
