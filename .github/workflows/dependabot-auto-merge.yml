name: Dependabot auto-merge

# Enables GitHub's native auto-merge on a Dependabot PR once it's opened, so it
# merges itself as soon as required CI checks pass — no manual review needed
# for the low-risk bumps Dependabot is configured to open (see dependabot.yml:
# majors are never opened at all, only patch/minor). The update-type check
# below is defense-in-depth in case that policy ever changes; it should
# always evaluate true today.
on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Enable auto-merge for non-major updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
