name: gem-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Dump gem environment (default, no overrides)
        run: |
          echo "=== which ruby ==="; which ruby; ruby -v
          echo "=== gem env (default) ==="; gem env
          echo "=== GEM_HOME / GEM_PATH in default runner env ==="
          echo "GEM_HOME=${GEM_HOME:-<unset>}"; echo "GEM_PATH=${GEM_PATH:-<unset>}"
          echo "=== is octokit present by default? ==="
          gem list octokit || echo "octokit NOT in default gem env"
          echo "=== RUBY version + gem version ==="; ruby -e 'puts "rubygems=#{Gem::VERSION} ruby=#{RUBY_VERSION}"'

      - name: Probe A: install to a fresh GEM_HOME dir, then require
        env:
          GEM_HOME: /tmp/probeA
        run: |
          echo "=== A: gem env under GEM_HOME=/tmp/probeA ==="; gem env home; echo "Gem.path="; ruby -e 'puts Gem.path.inspect'
          gem install --no-document --install-dir "$GEM_HOME" octokit 2>&1 | tail -3
          echo "=== A: filesystem check ==="; find /tmp/probeA -name 'octokit.rb' 2>/dev/null | head || echo "NOT in /tmp/probeA"
          echo "=== A: can require find it? ==="; ruby -e 'require "octokit"; puts "A REQUIRE OK"' 2>&1

      - name: Probe B: install with --user-install, then require (GEM_HOME default)
        run: |
          echo "=== B: user-install ==="; gem install --user-install --no-document octokit 2>&1 | tail -3
          echo "=== B: where did it land? ==="; gem env user_install
          echo "=== B: can require find it (default GEM_HOME)? ==="; ruby -e 'require "octokit"; puts "B REQUIRE OK"' 2>&1

      - name: Probe C: with GEM_HOME set, does gem install land in GEM_HOME and require find it?
        env:
          GEM_HOME: /tmp/probeC
          GEM_PATH: /tmp/probeC
        run: |
          echo "=== C: gem env under GEM_HOME=GEM_PATH=/tmp/probeC ==="; gem env home
          gem install --no-document octokit 2>&1 | tail -3
          echo "=== C: filesystem ==="; find /tmp/probeC -name 'octokit.rb' 2>/dev/null | head || echo "NOT in /tmp/probeC"
          echo "=== C: require ==="; ruby -e 'require "octokit"; puts "C REQUIRE OK"' 2>&1

      - name: Probe D: gem install --install-dir, then a FRESH ruby with GEM_HOME+GEM_PATH both set
        env:
          GEM_HOME: /tmp/probeD
          GEM_PATH: /tmp/probeD
        run: |
          gem install --no-document --install-dir /tmp/probeD octokit 2>&1 | tail -3
          echo "=== D: gem which ==="; gem which octokit 2>&1
          echo "=== D: filesystem /tmp/probeD ==="; find /tmp/probeD -name 'octokit.rb' 2>/dev/null | head || echo "NOT in /tmp/probeD"
          echo "=== D: Gem.path in fresh ruby ==="; ruby -e 'puts Gem.path.inspect; require "octokit"; puts "D REQUIRE OK"' 2>&1
