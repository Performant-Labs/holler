name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Lets a maintainer re-run the suite against a specific branch/commit without
  # needing an open PR (e.g. after force-pushing, or to verify a fix in place
  # before re-opening). No inputs; it just runs the same matrix.
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      # Windows is deliberately OFF the matrix (not soft-failed): ADR 0002
      # retires "Windows on the CI matrix" from the server. The job name is
      # `test` so the required checks are `test (ubuntu-latest)` and
      # `test (macos-latest)`.
      matrix:
        os: [ubuntu-latest, macos-latest]
    # holler is a PUBLIC repo with outside PRs welcome (ADR 0004), so the org
    # `CI_RUNNER` self-hosted variable must never drive a fork PR's job — per
    # the org convention (playbook infrastructure/ci-platform.md), a fork PR
    # must never execute on owned hardware. macOS has no self-hosted fleet
    # here, so it always stays on GitHub-hosted `macos-latest`. The ubuntu
    # leg uses the self-hosted runner ONLY for a same-repo push or a
    # same-repo (non-fork) pull_request — a fork PR's `head.repo.full_name`
    # never equals `github.repository`, so it falls through to
    # `ubuntu-latest`. Unlike the XPU fleet's intentionally-no-fallback
    # `vars.CI_RUNNER` wiring (FreeToken-Intel's ci.yml), the `|| matrix.os`
    # fallback here is a deliberate safety net for the fork-PR case, not an
    # accident to guard against — a missing/stale `CI_RUNNER` on a *trusted*
    # run just costs speed, never safety.
    runs-on: >-
      ${{
        (matrix.os == 'ubuntu-latest' &&
         (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository))
        && vars.CI_RUNNER || matrix.os
      }}
    steps:
      - uses: actions/checkout@v4

      # GitHub-hosted images ship rustup preinstalled; the self-hosted
      # Uranus/Jupiter runner image (pl-runner, layered on
      # myoung34/github-runner) does not (confirmed 2026-09-10, PR #312's
      # first CI run: `rustup: command not found`) — bootstrap it via the
      # official installer when missing instead of assuming it's there.
      - name: Install Rust
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest -Uri https://sh.rustup.rs -OutFile rustup-init.sh
            bash rustup-init.sh -y --default-toolchain none
            Add-Content -Path $env:GITHUB_PATH -Value "$HOME/.cargo/bin"
            $env:PATH = "$HOME/.cargo/bin:$env:PATH"
          }
          rustup toolchain install stable
        shell: pwsh

      # ~/.cargo (registry/git) and target/ across runs, keyed on the OS,
      # job, and Cargo.lock hash — the standard Swatinem/rust-cache setup.
      # Cuts the workspace build (holler-body/holler-cli/holler-hub/
      # holler-proto plus their dev-deps) from a cold multi-minute build to
      # a warm incremental one on every step below that invokes `cargo`.
      - uses: Swatinem/rust-cache@v2

      # Step 0 (issue #149/#155): the source-shape guards that need no
      # compiler — unjustified #[allow], process::exit outside main.rs, a
      # hard-coded CARGO_BIN_EXE_ path, an oversized file, an unattributed
      # workspace dependency. Cheapest check, so it runs before anything is
      # built; it is the same script a contributor runs locally.
      - name: Lint (scripts/lint.sh)
        run: bash scripts/lint.sh
        shell: bash

      # Issue #319: CHANGELOG.md must always carry an `## [Unreleased]`
      # heading — cheap, no-compiler-needed check, so it runs right after
      # scripts/lint.sh and before anything that touches the compiler.
      - name: Changelog (scripts/changelog-check.sh)
        run: bash scripts/changelog-check.sh
        shell: bash

      # 1. The canary is the first gate that touches the compiler.
      # `--test wire_selftest` alone (not `cargo test`, which also builds
      # the libs) so CI goes red as early as possible if the runner ever
      # swallows a failure. This is the test-of-tests: it proves the
      # harness detects a child that exits 1, a nested panic, a closed-port
      # connect, and a booted tokio runtime — before any real e2e relies on
      # the runner (ADR 0002; Windows off).
      - name: Canary (fail-fast)
        run: cargo test -p holler-cli --test wire_selftest
        shell: pwsh

      # 2. The wire-protocol crate in isolation — the shared vocabulary
      # every other crate depends on. Named separately so a wire/codec
      # regression is attributable at a glance, without waiting on the
      # rest of the workspace to build.
      - name: Codec
        run: cargo test -p holler-proto
        shell: pwsh

      # 3. Everything else: holler-body, holler-cli, holler-hub, and the
      # remaining holler-proto/holler-cli integration suites (including
      # docs_cli_test.rs and docs_wire_test.rs). Excludes `#[ignore]`d
      # tests by default (both the real cross-process ones covered by step
      # 4, and the upstream-SDK-blocked ones tracked under #188/#272, which
      # stay skipped everywhere in this matrix).
      - name: Workspace suite
        run: cargo test --workspace
        shell: pwsh

      # 4. Real cross-process interop, run explicitly via `-- --ignored`.
      # These two body_run_test.rs cases are the single-binary equivalent
      # of holler-server's split-binary interop step: they start a real
      # `holler hub serve` + a real `holler body run` and time an actual
      # process restart and reconnect (hub_restart_is_recovered_by_reconnect,
      # fresh_hello_and_presence_on_every_reconnect), tagged
      # "test-tag-interop" in the source. Deliberately does NOT include
      # acp_driver_crash_test.rs / session_manager_test.rs's `#[ignore]`d
      # cases — those are the upstream SDK crash-watcher defect (#188/#272),
      # confirmed not fixable in this crate, and stay skipped here too.
      - name: Interop-tagged (real cross-process)
        run: cargo test -p holler-cli --test body_run_test -- --ignored
        shell: pwsh

      # The runner-port story (#170) adds scripts/test_selection_test.rb;
      # this step is skipped until that file exists. It runs on the
      # runners' preinstalled Ruby (2.6 on macOS) -- the selection core is
      # deliberately stdlib-only so no gem install is needed. GitHub-hosted
      # images ship Ruby; the self-hosted Uranus/Jupiter pl-runner image
      # doesn't (same gap class as rustup above, confirmed 2026-09-10 on
      # PR #312) -- bootstrap via apt when missing, same no-op-on-hosted
      # shape as the Rust step.
      - name: test_selection_test (runner port)
        if: hashFiles('scripts/test_selection_test.rb') != ''
        run: |
          if (-not (Get-Command ruby -ErrorAction SilentlyContinue)) {
            sudo apt-get update -qq
            sudo apt-get install -y -qq ruby
          }
          ruby scripts/test_selection_test.rb
        shell: pwsh

      # test-run.rb smoke (#170). The issue's exact ask:
      #   "a shell smoke in CI: `ruby scripts/test-run.rb exec --list` against
      #    a repo with >=1 real case prints >=1 line (there are 0 real cases yet
      #    -- the retrofit is happening in parallel ... until cases exist
      #    `discover` must exit 0 with `[]`; write the smoke test to TOLERATE
      #    that)."
      # So the smoke's contract is: run `exec --list` (a whole-catalog
      # preview) and FAIL ONLY IF the script errors out (non-zero exit /
      # crash). It deliberately does NOT assert on the line count: today the
      # catalog is empty, so the preview resolves to 0 cases and the script
      # prints a short "0 case(s) matched" line and exits 0 -- the tolerated
      # outcome. Once a real case lands it prints >=1 case line (and the same
      # non-zero-exit assertion still passes). That is what "tolerate that"
      # means.
      #
      #   * Token-free by design. `exec --list` is a whole-catalog PREVIEW:
      #     it only reads the catalog to display it and never launches a
      #     process or fetches a single issue. test-run.rb therefore builds
      #     the GitHub client (and `require`s octokit) ONLY for the paths that
      #     genuinely touch GitHub -- `--last-failed` (fetches issue N) and the
      #     run path (launches processes). A pure preview passes a nil client,
      #     so `discover` returns [] immediately: no GITHUB_TOKEN is read and
      #     octokit is never loaded. This keeps the smoke immune to two runner
      #     facts that earlier revisions tripped over -- this repo does not
      #     (yet) configure a GitHub token secret for Actions (so GITHUB_TOKEN
      #     is empty and the API 401s), and the gem environment on a
      #     workflow_dispatch run resolves octokit differently than on a
      #     pull_request run (one loads, one does not). An empty catalog is
      #     exactly #170's "tolerate an empty catalog" contract; once a token
      #     is added (a follow-up) the same smoke prints the real cases and
      #     still passes.
      #   * ubuntu-only: macOS's preinstalled 2.6 Ruby is below what the
      #     runner script needs, and a Homebrew Ruby would add an install step
      #     #170 does not ask for; the full minitest suite already runs on both.
      - name: test-run.rb exec --list smoke (runner port)
        if: hashFiles('scripts/test-run.rb') != '' && matrix.os == 'ubuntu-latest'
        run: |
          # No GITHUB_TOKEN / no octokit: `exec --list` is a pure preview, so
          # the script never builds the client (and thus never requires
          # octokit). We assert only on a hard error (non-zero exit / crash);
          # a zero-case "0 case(s) matched" output is the expected, tolerated
          # outcome while the catalog is empty, and >=1 case line once cases land.
          ruby scripts/test-run.rb exec --list
          echo "ok: exec --list ran without erroring (catalog empty -> 0 cases, tolerated)"
        shell: bash

      # 5. Clippy over the whole workspace, including test/bench targets —
      # a `#[cfg(test)]`-only lint violation must fail CI too.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        shell: pwsh

      # 6. Docs: docs_cli_test.rs parses every `holler …` command shown in
      # README.md and docs/**/*.md against the real CLI and fails if one no
      # longer matches — the "README parses as documented" check the issue
      # asks for already exists as this test. Named separately (it also
      # runs as part of step 3's `cargo test --workspace`) so a docs
      # regression is attributable without having to open the workspace-
      # suite log. scripts/lint.sh already runs as its own named step
      # above, so it is not duplicated here.
      - name: Docs
        run: cargo test -p holler-cli --test docs_cli_test
        shell: pwsh

      # Unused dependencies fail the build (issue #155 §7): a crate must
      # declare only what it consumes. Runs once (ubuntu) — the answer does
      # not depend on the OS.
      - name: Unused dependencies (cargo machete)
        if: matrix.os == 'ubuntu-latest'
        uses: bnjbvr/cargo-machete@main

      # Advisory only (issue #155 §7): a PR past 800 added lines is warned,
      # not failed — reviewers decide whether it should have been split.
      - name: PR size
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        env:
          ADDED: ${{ github.event.pull_request.additions }}
        run: |
          if [ "$ADDED" -gt 800 ]; then
            echo "::warning title=Large PR::This PR adds $ADDED lines (guideline: 800). Consider splitting it."
          else
            echo "PR adds $ADDED lines (guideline: 800)."
          fi
        shell: bash
