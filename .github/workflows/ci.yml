name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Lets a maintainer re-run the suite against a specific branch/commit without
  # needing an open PR (e.g. after force-pushing, or to verify a fix in place
  # before re-opening). No inputs; it just runs the same matrix.
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      # Windows is deliberately OFF the matrix (not soft-failed): ADR 0002
      # retires "Windows on the CI matrix" from the server. The job name is
      # `test` so the required checks are `test (ubuntu-latest)` and
      # `test (macos-latest)`.
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable
        shell: pwsh

      # Step 0 (issue #149/#155): the source-shape guards that need no
      # compiler — unjustified #[allow], process::exit outside main.rs, a
      # hard-coded CARGO_BIN_EXE_ path, an oversized file, an unattributed
      # workspace dependency. Cheapest check, so it runs before anything is
      # built; it is the same script a contributor runs locally.
      - name: Lint (scripts/lint.sh)
        run: bash scripts/lint.sh
        shell: bash

      # The canary is the first gate. `--test wire_selftest` alone (not
      # `cargo test`, which also builds the libs) so CI goes red as early as
      # possible if the runner ever swallows a failure. This is the
      # test-of-tests: it proves the harness detects a child that exits 1, a
      # nested panic, a closed-port connect, and a booted tokio runtime —
      # before any real e2e relies on the runner (ADR 0002; Windows off).
      - name: Canary (fail-fast)
        run: cargo test -p holler-cli --test wire_selftest
        shell: pwsh

      - name: Full test suite
        run: cargo test --workspace
        shell: pwsh

      # The runner-port story (#170) adds scripts/test_selection_test.rb;
      # this step is skipped until that file exists. It runs on the
      # runners' preinstalled Ruby (2.6 on macOS) -- the selection core is
      # deliberately stdlib-only so no gem install is needed.
      - name: test_selection_test (runner port)
        if: hashFiles('scripts/test_selection_test.rb') != ''
        run: ruby scripts/test_selection_test.rb
        shell: pwsh

      # test-run.rb smoke (#170). The issue's exact ask:
      #   "a shell smoke in CI: `ruby scripts/test-run.rb exec --list` against
      #    a repo with >=1 real case prints >=1 line (there are 0 real cases yet
      #    -- the retrofit is happening in parallel ... until cases exist
      #    `discover` must exit 0 with `[]`; write the smoke test to TOLERATE
      #    that)."
      # So the smoke's contract is: run `exec --list` (a whole-catalog
      # preview) and FAIL ONLY IF the script errors out (non-zero exit /
      # crash). It deliberately does NOT assert on the line count: today the
      # catalog is empty, so the preview resolves to 0 cases and the script
      # prints a short "0 case(s) matched" line and exits 0 -- the tolerated
      # outcome. Once a real case lands it prints >=1 case line (and the same
      # non-zero-exit assertion still passes). That is what "tolerate that"
      # means.
      #
      #   * Token-free by design. `exec --list` is a whole-catalog PREVIEW:
      #     it only reads the catalog to display it and never launches a
      #     process or fetches a single issue. test-run.rb therefore builds
      #     the GitHub client (and `require`s octokit) ONLY for the paths that
      #     genuinely touch GitHub -- `--last-failed` (fetches issue N) and the
      #     run path (launches processes). A pure preview passes a nil client,
      #     so `discover` returns [] immediately: no GITHUB_TOKEN is read and
      #     octokit is never loaded. This keeps the smoke immune to two runner
      #     facts that earlier revisions tripped over -- this repo does not
      #     (yet) configure a GitHub token secret for Actions (so GITHUB_TOKEN
      #     is empty and the API 401s), and the gem environment on a
      #     workflow_dispatch run resolves octokit differently than on a
      #     pull_request run (one loads, one does not). An empty catalog is
      #     exactly #170's "tolerate an empty catalog" contract; once a token
      #     is added (a follow-up) the same smoke prints the real cases and
      #     still passes.
      #   * ubuntu-only: macOS's preinstalled 2.6 Ruby is below what the
      #     runner script needs, and a Homebrew Ruby would add an install step
      #     #170 does not ask for; the full minitest suite already runs on both.
      - name: test-run.rb exec --list smoke (runner port)
        if: hashFiles('scripts/test-run.rb') != '' && matrix.os == 'ubuntu-latest'
        run: |
          # No GITHUB_TOKEN / no octokit: `exec --list` is a pure preview, so
          # the script never builds the client (and thus never requires
          # octokit). We assert only on a hard error (non-zero exit / crash);
          # a zero-case "0 case(s) matched" output is the expected, tolerated
          # outcome while the catalog is empty, and >=1 case line once cases land.
          ruby scripts/test-run.rb exec --list
          echo "ok: exec --list ran without erroring (catalog empty -> 0 cases, tolerated)"
        shell: bash

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        shell: pwsh

      # Unused dependencies fail the build (issue #155 §7): a crate must
      # declare only what it consumes. Runs once (ubuntu) — the answer does
      # not depend on the OS.
      - name: Unused dependencies (cargo machete)
        if: matrix.os == 'ubuntu-latest'
        uses: bnjbvr/cargo-machete@main

      # Advisory only (issue #155 §7): a PR past 800 added lines is warned,
      # not failed — reviewers decide whether it should have been split.
      - name: PR size
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        env:
          ADDED: ${{ github.event.pull_request.additions }}
        run: |
          if [ "$ADDED" -gt 800 ]; then
            echo "::warning title=Large PR::This PR adds $ADDED lines (guideline: 800). Consider splitting it."
          else
            echo "PR adds $ADDED lines (guideline: 800)."
          fi
        shell: bash
