# clippy.toml (issue #149): thresholds for the workspace `[lints]` denies.
#
# cognitive_complexity and too_many_lines are denied in `[workspace.lints.clippy]`;
# the thresholds that trigger them live here so a threshold bump is one line,
# not a Cargo.toml edit.
cognitive-complexity-threshold = 15
too-many-lines-threshold = 100
